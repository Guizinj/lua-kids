  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="announcement"
      ><span>Atacado em grades fechadas <b>·</b> Pedido mínimo de 10 peças</span
      ><span class="announcement-delivery">Entrega grátis em Caruaru/PE</span></div
    >
    <!-- O componente estrutura.js preenche a marca, a busca e os contadores. -->
    <header class="site-header" id="header"></header>
    <div class="demo-bar"
      ><span class="demo-dot"></span><strong>Prévia para avaliação</strong
      ><span
        >Produtos, valores e pedidos ilustrativos. Nenhuma compra real será efetuada.</span
      ></div
    >
    <!-- aplicacao.js troca somente esta área ao navegar pelas rotas. -->
    <main id="conteudo" tabindex="-1"></main>
    <footer class="site-footer" id="footer"></footer>
    <!-- Diálogos nativos: o navegador controla foco e fechamento pelo teclado. -->
    <dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title"></dialog>
    <dialog id="message-dialog" class="message-dialog" aria-labelledby="message-title"></dialog>
    <dialog
      id="dialogo-aviso"
      class="dialogo-aviso"
      aria-labelledby="titulo-dialogo-aviso"
    ></dialog>
    <dialog id="menu-lateral" class="painel-lateral" aria-labelledby="titulo-menu"></dialog>
    <dialog
      id="painel-filtros"
      class="painel-lateral painel-filtros"
      aria-labelledby="titulo-filtros"
      ><div class="cabecalho-painel"
        ><h2 id="titulo-filtros">Filtrar e ordenar</h2
        ><button class="icon-button" data-action="filtros-fechar" aria-label="Fechar filtros"
          >×</button
        ></div
      ><div class="conteudo-filtros"></div
      ><div class="acoes-filtros"
        ><button class="button secondary" data-action="filtros-limpar">Limpar</button
        ><button class="button" data-action="filtros-aplicar">Aplicar filtros</button></div
      ></dialog
    >
    <a
      id="whatsapp-flutuante"
      class="whatsapp-flutuante"
      aria-label="Falar com a Lua Kids pelo WhatsApp"
      target="_blank"
      rel="noopener noreferrer"
    ></a>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="container notice"
        >Ative o JavaScript para navegar no catálogo e experimentar o carrinho.</p
      ></noscript
    >
  </body>
